server:
  address: 127.0.0.1
  port: 8081
spring:
  # 从仓库根目录 .env 读取本地凭证：.env 已被 .gitignore 排除，密钥不进仓库。
  # 三个相对路径覆盖不同工作目录（模块目录 / 仓库根 / target），缺失的文件会被 optional 忽略。
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
      - optional:file:../../.env[.properties]
  application:
    name: eldercare-mock-payment
  datasource:
    url: jdbc:mysql://127.0.0.1:${MYSQL_PORT:3306}/eldercare_payment?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${PAYMENT_DB_USER}
    password: ${PAYMENT_DB_PASSWORD}
  web:
    resources:
      add-mappings: false
