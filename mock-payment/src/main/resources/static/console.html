<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>本地模拟支付控制台</title><style>body{font:16px "Microsoft YaHei",sans-serif;background:#f6f8f6;color:#18382f;max-width:720px;margin:70px auto;padding:0 20px}main{background:white;border:1px solid #e2eae4;border-radius:24px;padding:36px}h1{font-size:30px}label{display:block;margin:16px 0 6px}input,select,button{font:inherit;padding:12px;border:1px solid #cbd9d0;border-radius:10px;width:100%;box-sizing:border-box}button{background:#128a6c;color:white;border:0;cursor:pointer;margin-top:18px}button:focus-visible,input:focus-visible{outline:3px solid #50bfa0}pre{white-space:pre-wrap;word-break:break-all;background:#eef6f0;padding:16px;border-radius:12px}</style></head><body><main><p>仅供 Windows 本地测试 · 不涉及真实资金</p><h1>模拟支付控制台</h1><label>控制台令牌</label><input id="token" type="password" autocomplete="off"><label>主系统支付尝试标识</label><input id="ref"><label>订单编号</label><input id="order" type="number" min="1"><label>结算版本</label><input id="version" type="number" min="1" value="1"><label>金额</label><input id="amount" type="number" min="0" step="0.01"><button id="create">登记测试交易</button><label>交易结果</label><select id="status"><option value="SUCCESS">成功</option><option value="FAILED">失败</option><option value="CANCELLED">取消</option></select><button id="decide">设置交易结果</button><pre id="result" role="status">请填写主系统显示的尝试信息。</pre></main><script>const $=id=>document.getElementById(id);async function send(path,body){try{const response=await fetch('/api/transactions'+path,{method:'POST',headers:{'Content-Type':'application/json','X-Console-Token':$('token').value},body:JSON.stringify(body)});$('result').textContent=JSON.stringify(await response.json(),null,2)+'\nHTTP '+response.status}catch(error){$('result').textContent=String(error)}}$('create').onclick=()=>send('',{attemptRef:$('ref').value,orderRef:Number($('order').value),settlementVersion:Number($('version').value),amount:$('amount').value});$('decide').onclick=()=>send('/'+encodeURIComponent($('ref').value)+'/status',{status:$('status').value});</script></body></html>
