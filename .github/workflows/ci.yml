name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端测试（含集成测试）
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: eldercare_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -uroot -pci-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 创建测试库账号
        run: |
          mysql -h127.0.0.1 -P3306 -uroot -pci-root-password -e "
            CREATE USER IF NOT EXISTS 'eldercare_test_app'@'%' IDENTIFIED BY 'ci-test-password';
            GRANT ALL PRIVILEGES ON eldercare_test.* TO 'eldercare_test_app'@'%';
            FLUSH PRIVILEGES;"

      # IntegrationTestBase 从仓库根目录读取 .env；这里只写 CI 用的测试库配置
      - name: 写入 CI 专用 .env
        run: |
          printf '%s\n' \
            'TEST_DB_URL=jdbc:mysql://127.0.0.1:3306/eldercare_test?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowMultiQueries=true' \
            'TEST_DB_USER=eldercare_test_app' \
            'TEST_DB_PASSWORD=ci-test-password' > .env

      - name: 主服务测试
        working-directory: backend
        run: mvn -B -ntp test

      - name: 模拟支付测试
        working-directory: mock-payment
        run: mvn -B -ntp test

      - name: 上传失败报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: |
            backend/target/surefire-reports/
            mock-payment/target/surefire-reports/
          retention-days: 7

  frontend:
    name: 前端静态检查与测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: 格式检查
        run: npm run format:check

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试
        run: npm run test:run

      - name: 生产构建
        run: npm run build

  # 说明：端到端冒烟（npm run test:e2e）需要真实后端与本机 Chrome，只在本地执行：
  #   ./scripts/ci.ps1 或 npm run test:e2e（先启动 backend 与 dev server）
