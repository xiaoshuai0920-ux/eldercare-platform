server:
  address: 127.0.0.1
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: false
spring:
  # 从仓库根目录 .env 读取本地凭证：.env 已被 .gitignore 排除，密钥不进仓库。
  # 三个相对路径覆盖不同工作目录（模块目录 / 仓库根 / target），缺失的文件会被 optional 忽略。
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
      - optional:file:../../.env[.properties]
  application:
    name: eldercare-backend
  datasource:
    url: jdbc:mysql://127.0.0.1:${MYSQL_PORT:3306}/eldercare?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jackson:
    time-zone: Asia/Shanghai
app:
  timezone: Asia/Shanghai
  bootstrap-admin-username: admin
  bootstrap-admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  bootstrap-admin-reset: ${BOOTSTRAP_ADMIN_RESET:false}
  demo-data:
    enabled: false
    reset-passwords: false
    password: ${DEMO_ACCOUNT_PASSWORD:}
  mock-payment:
    enabled: false
  payment-base-url: ${PAYMENT_BASE_URL:}
