server:
  address: 127.0.0.1
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: false
spring:
  application:
    name: eldercare-backend
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/eldercare?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: ${DB_PASSWORD}
  jackson:
    time-zone: Asia/Shanghai
  mail:
    host: localhost
    port: 465
    username: ""
    password: ""
app:
  timezone: Asia/Shanghai
  email-mode: demo
  mail-from: ""
  bootstrap-admin-email: admin@example.invalid
  bootstrap-admin-password: ${BOOTSTRAP_ADMIN_PASSWORD}
  payment-base-url: http://127.0.0.1:8081
  payment-service-token: ${PAYMENT_SERVICE_TOKEN}
