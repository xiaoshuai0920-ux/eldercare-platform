server:
  address: 127.0.0.1
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: false
spring:
  application:
    name: eldercare-backend
  datasource:
    url: jdbc:mysql://127.0.0.1:${MYSQL_PORT:3306}/eldercare?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jackson:
    time-zone: Asia/Shanghai
app:
  timezone: Asia/Shanghai
  bootstrap-admin-username: admin
  bootstrap-admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  bootstrap-admin-reset: ${BOOTSTRAP_ADMIN_RESET:false}
  demo-data:
    enabled: false
    reset-passwords: false
    password: ${DEMO_ACCOUNT_PASSWORD:}
  mock-payment:
    enabled: false
  payment-base-url: ${PAYMENT_BASE_URL:}
